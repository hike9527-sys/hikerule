      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国节点
      - 🌐 全部节点
      - DIRECT

  # Apple
  - name: 🍎 Apple
    type: select
