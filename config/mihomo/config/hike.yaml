  # 支付及加密货币网站
  - name: 💶 Wallet
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国节点
      - 🌐 全部节点
