# ============================================================
# Sub-Store → Nikki 通用 Mihomo 覆写模板 v2
# 地区：港/台/日/韩/新/菲/美 + 倍率组；自动测速与故障转移默认排除香港
# Nikki 要点：
#   - 端口/TUN/重定向由「代理配置 + 混入」接管，本模板不写 tun
#   - 面板依赖 external-controller(api)，混入可覆写
#   - 使用前请关闭 OpenWrt「网络 → DHCP/DNS → DNS 重定向」
#   - 规则集走 jsdmirror 镜像，避免路由器直连 GitHub 失败
# ============================================================

ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""

dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
    - "rule-set:private_domain"
    - "rule-set:fakeip_filter"
    - "rule-set:cn_domain"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://1.1.1.1/dns-query#🚀 默认代理"
    - "https://8.8.8.8/dns-query#🚀 默认代理"
  nameserver-policy:
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"

group-anchor:
  common: &common
    interval: 600
    timeout: 3000
    lazy: true
    max-failed-times: 3

  urltest: &urltest
    <<: *common
    type: url-test
    tolerance: 50
    url: "https://www.gstatic.com/generate_204"

  select: &select
    <<: *common
    type: select

proxy-groups:

  - name: 🚀 默认代理
    <<: *select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - ⚖️ 负载均衡
      - 💰 低倍率节点
      - 💸 高倍率节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇸🇬 新加坡节点
      - 🇵🇭 菲律宾节点
      - 🇺🇸 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: ♻️ 自动选择
    <<: *urltest
    include-all: true
    exclude-filter: "(?i)(港|HK|Hong Kong|一元机场)|(?i)(剩余|到期|流量|官网|客服|电报|频道|订阅|通知|教程|更新|过期|已用|联系|邮箱|工单|机场|防失联|无法|提示|获取|网址|优惠|福利|邀请|version|traffic|expire|t\\.me|https?://|@)"

  - name: 🔯 故障转移
    <<: *common
    type: fallback
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    exclude-filter: "(?i)(港|HK|Hong Kong|一元机场)|(?i)(剩余|到期|流量|官网|客服|电报|频道|订阅|通知|教程|更新|过期|已用|联系|邮箱|工单|机场|防失联|无法|提示|获取|网址|优惠|福利|邀请|version|traffic|expire|t\\.me|https?://|@)"

  - name: ⚖️ 负载均衡
    <<: *common
    type: load-balance
    strategy: sticky-sessions
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    exclude-filter: "(?i)(剩余|到期|流量|官网|客服|电报|频道|订阅|通知|教程|更新|过期|已用|联系|邮箱|工单|机场|防失联|无法|提示|获取|网址|优惠|福利|邀请|version|traffic|expire|t\\.me|https?://|@)"

  - name: 💰 低倍率节点
    <<: *select
    include-all: true
    filter: "(?i)(低倍|免费|白嫖|free|0\\.[0-9]+[*×x]|[(*×x]0\\.[0-9]+)"
    exclude-filter: "(?i)(剩余|到期|流量|官网|客服|电报|频道|订阅|通知|教程|更新|过期|已用|联系|邮箱|工单|机场|防失联|无法|提示|获取|网址|优惠|福利|邀请|version|traffic|expire|t\\.me|https?://|@)"

  - name: 💸 高倍率节点
