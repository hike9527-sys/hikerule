    filter: "(?i)([2-9][0-9]*[*×x]|[1-9][0-9]+[*×x]|[*×x][2-9][0-9]*|[2-9][0-9]*倍|[1-9][0-9]+倍)"
    exclude-filter: "(?i)(剩余|到期|流量|官网|客服|电报|频道|订阅|通知|教程|更新|过期|已用|联系|邮箱|工单|机场|防失联|无法|提示|获取|网址|优惠|福利|邀请|version|traffic|expire|t\\.me|https?://|@)"

