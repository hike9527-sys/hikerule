  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  - RULE-SET,ai_domain,🤖 AI
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft_cn_domain,DIRECT
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,apple_cn_domain,DIRECT
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 Wallet
  - RULE-SET,binance_domain,💶 Wallet
  - RULE-SET,okx_domain,💶 Wallet
  - RULE-SET,crypto_domain,💶 Wallet
  - RULE-SET,steam_cn_domain,DIRECT
  - RULE-SET,steam_domain,🎮 Steam

  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,not_cn_domain,🚀 默认代理

  - RULE-SET,google_ip,🍀 Google,no-resolve
  - RULE-SET,apple_ip,🍎 Apple,no-resolve
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
  - RULE-SET,netflix_ip,🎥 NETFLIX,no-resolve
  - RULE-SET,cn_ip,DIRECT,no-resolve

  - MATCH,🚀 默认代理

rule-anchor:
  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs
  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs

rule-providers:
  private_domain:
    <<: *domain
    url: "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"
  private_ip:
    <<: *ip
    url: "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs"
  fakeip_filter:
    <<: *domain
    url: "https://cdn.jsdmirror.com/gh/appshubcc/bett-rules@meta/geo/geosite/fakeip-filter.mrs"

  ai_domain:
