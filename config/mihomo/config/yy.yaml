
# Sub-Store Mihomo 覆写模板
# 不包含机场节点，由 Sub-Store 合并订阅节点

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# TUN
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"

# 策略组
proxy-groups:
  # 默认出口
  - name: 🚀 默认代理
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  # 业务分流
  - name: 📹 YouTube
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: 🍀 Google
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: 🤖 AI
    type: select
    proxies:
      - 🔯 故障转移
      - ♻️ 自动选择
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - 🚀 默认代理
      - DIRECT

  - name: 👨🏿‍💻 GitHub
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: 🐬 OneDrive
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: 🪟 Microsoft
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: 🎵 TikTok
    type: select
    proxies:
      - 🔯 故障转移
      - ♻️ 自动选择
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - 🚀 默认代理
      - DIRECT

  - name: 📲 Telegram
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: 🎥 NETFLIX
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: 💶 Wallet
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: 🎮 Steam
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  - name: 🍎 Apple
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🌐 全部节点
      - DIRECT

  # 地区手动选择
  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    filter: "(?i)(港|HK|Hong Kong)"

  - name: 🇯🇵 日本节点
    type: select
    include-all: true
    filter: "(?i)(日|JP|Japan)"

  - name: 🇺🇲 美国节点
    type: select
    include-all: true
    filter: "(?i)(美|US|United States|America)"

  # 唯一的全局自动测速组：排除香港及 DIRECT
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    lazy: true
    filter: "^(?!.*(港|HK|Hong Kong|DIRECT|一元机场)).*$"

  # 唯一的全局故障转移组：排除香港及 DIRECT
  - name: 🔯 故障转移
    type: fallback
    include-all: true
    interval: 300
    lazy: true
    filter: "^(?!.*(港|HK|Hong Kong|DIRECT|一元机场)).*$"

  # 所有节点手动选择
  - name: 🌐 全部节点
    type: select
    include-all: true

# 规则
rules:
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,ai_domain,🤖 AI
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoftcn_domain,DIRECT
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 Wallet
  - RULE-SET,binance_domain,💶 Wallet
  - RULE-SET,okx_domain,💶 Wallet
  - RULE-SET,usd_domain,💶 Wallet
  - RULE-SET,steamcn_domain,DIRECT
  - RULE-SET,steam_domain,🎮 Steam
  - RULE-SET,cn!_domain,🚀 默认代理
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,apple_ip,🍎 Apple
  - RULE-SET,telegram_ip,📲 Telegram
  - RULE-SET,netflix_ip,🎥 NETFLIX
  - RULE-SET,cn_ip,DIRECT
  - MATCH,🚀 默认代理

# 规则集通用参数
rule-anchor:
  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs

  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs

rule-providers:
